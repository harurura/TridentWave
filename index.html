<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TridentWave</title>
<style>
  html, body { margin: 0; height: 100%; background: #0b0d14; overflow: hidden; }
  body { display: flex; align-items: center; justify-content: center; font-family: system-ui, "Hiragino Sans", "Yu Gothic", sans-serif; }
  canvas { background: #121624; cursor: none; max-width: 100vw; max-height: 100vh; aspect-ratio: 16 / 9; width: min(100vw, calc(100vh * 16 / 9)); image-rendering: auto; }
</style>
</head>
<body>
<canvas id="game" width="960" height="540"></canvas>
<script>
"use strict";
// ============================================================
//  TridentWave - 試作版 v0.1
//  自機固定 / 3方向(左・右・上)から来る敵 / マウスエイム自動連射
// ============================================================

const cv = document.getElementById("game");
const ctx = cv.getContext("2d");
const W = cv.width, H = cv.height;
const GY = 470;                 // 地面の高さ
const P = { x: W / 2, y: GY - 22 }; // 自機の位置(固定)

// ---------------- 入力 ----------------
const mouse = { x: W / 2, y: 200, down: false };
cv.addEventListener("mousemove", e => {
  const r = cv.getBoundingClientRect();
  mouse.x = (e.clientX - r.left) * (W / r.width);
  mouse.y = (e.clientY - r.top) * (H / r.height);
});
cv.addEventListener("mousedown", e => { mouse.down = true; onClick(); });
window.addEventListener("mouseup", () => mouse.down = false);
window.addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (state === "levelup" && ["1", "2", "3"].includes(k)) chooseUpgrade(+k - 1);
  if ((k === "p" || k === "escape") && (state === "play" || state === "pause")) state = state === "play" ? "pause" : "play";
  if (k === "m") sound.muted = !sound.muted;
  if (k === "t") autoAim = !autoAim;
  if (k === "enter" && (state === "title" || state === "over")) startGame();
});

// ---------------- サウンド(WebAudioで簡易生成) ----------------
const sound = {
  ac: null, muted: false,
  init() { if (!this.ac) { try { this.ac = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) {} } },
  play(freq, dur, type = "square", vol = 0.05, slide = 0) {
    if (this.muted || !this.ac) return;
    const t = this.ac.currentTime, o = this.ac.createOscillator(), g = this.ac.createGain();
    o.type = type; o.frequency.setValueAtTime(freq, t);
    if (slide) o.frequency.exponentialRampToValueAtTime(Math.max(30, freq + slide), t + dur);
    g.gain.setValueAtTime(vol, t); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
    o.connect(g).connect(this.ac.destination); o.start(t); o.stop(t + dur);
  },
};
const sfx = {
  shot: () => sound.play(880, 0.05, "square", 0.015, -400),
  hit: () => sound.play(220, 0.06, "triangle", 0.04, -100),
  kill: () => sound.play(160, 0.15, "sawtooth", 0.04, -120),
  hurt: () => sound.play(90, 0.3, "sawtooth", 0.08, -50),
  gem: () => sound.play(1200, 0.06, "sine", 0.03, 300),
  lvl: () => { sound.play(523, 0.12, "square", 0.05); setTimeout(() => sound.play(784, 0.18, "square", 0.05), 110); },
  item: () => sound.play(660, 0.25, "sine", 0.06, 600),
  bomb: () => sound.play(60, 0.6, "sawtooth", 0.12, -20),
};

// ---------------- 敵の定義 ----------------
// kind: ground=左右の地上 / air=空(上や斜め) / side=左右の空中
const ENEMY = {
  grunt:   { name: "歩兵",   hp: 3,   speed: 42,  r: 14, color: "#e05a5a", dmg: 8,  xp: 1, kind: "ground", from: 0 },
  runner:  { name: "突撃兵", hp: 2,   speed: 115, r: 11, color: "#f2a33a", dmg: 6,  xp: 1, kind: "ground", from: 25 },
  bat:     { name: "コウモリ", hp: 2, speed: 70,  r: 11, color: "#b86bff", dmg: 5,  xp: 1, kind: "side",   from: 15 },
  diver:   { name: "降下兵", hp: 4,   speed: 55,  r: 13, color: "#4fc3f7", dmg: 8,  xp: 2, kind: "air",    from: 0 },
  brute:   { name: "重装兵", hp: 16,  speed: 24,  r: 22, color: "#8d6e63", dmg: 20, xp: 5, kind: "ground", from: 60 },
  spitter: { name: "砲撃手", hp: 7,   speed: 40,  r: 15, color: "#66bb6a", dmg: 0,  xp: 4, kind: "hover",  from: 90 },
  boss:    { name: "巨兵",   hp: 160, speed: 16,  r: 40, color: "#d84315", dmg: 45, xp: 40, kind: "ground", from: 99999 },
};

// ---------------- 強化の定義 ----------------
const UPGRADES = [
  { id: "dmg",    name: "攻撃力アップ",   desc: "弾のダメージ +25%",          max: 8, apply: s => s.dmg *= 1.25 },
  { id: "rate",   name: "連射速度アップ", desc: "発射間隔 -15%",              max: 8, apply: s => s.fireInt *= 0.85 },
  { id: "multi",  name: "拡散弾",         desc: "同時に撃つ弾 +1(扇状)",    max: 5, apply: s => s.multi += 1 },
  { id: "pierce", name: "貫通弾",         desc: "弾が敵を +1体 貫通",         max: 5, apply: s => s.pierce += 1 },
  { id: "speed",  name: "弾速アップ",     desc: "弾の速さ +20%",              max: 4, apply: s => s.bulletSpeed *= 1.2 },
  { id: "boom",   name: "爆裂弾",         desc: "命中時に小爆発(範囲拡大)",  max: 4, apply: s => s.boom += 1 },
  { id: "maxhp",  name: "装甲強化",       desc: "最大HP +20、20回復",         max: 6, apply: s => { s.maxHp += 20; s.hp = Math.min(s.maxHp, s.hp + 20); } },
  { id: "regen",  name: "自己修復",       desc: "毎秒 HP +0.6 回復",          max: 5, apply: s => s.regen += 0.6 },
  { id: "tL",     name: "左タレット",     desc: "左側の敵を自動で撃つ砲台",   max: 5, apply: s => s.turrets.L += 1 },
  { id: "tR",     name: "右タレット",     desc: "右側の敵を自動で撃つ砲台",   max: 5, apply: s => s.turrets.R += 1 },
  { id: "tU",     name: "対空タレット",   desc: "上空の敵を自動で撃つ砲台",   max: 5, apply: s => s.turrets.U += 1 },
  { id: "heal",   name: "緊急修理",       desc: "HPを50%回復",                max: 99, apply: s => s.hp = Math.min(s.maxHp, s.hp + s.maxHp * 0.5) },
];

// ---------------- ドロップアイテム(撃って取る) ----------------
const ITEMS = {
  heart:  { label: "♥", color: "#ff5c8a", desc: "HP+25" },
  bomb:   { label: "B", color: "#ffd54f", desc: "画面の敵に大ダメージ" },
  frenzy: { label: "F", color: "#4dd0e1", desc: "8秒間 連射2倍" },
};

// ---------------- ゲーム状態 ----------------
let state = "title";
let autoAim = false;
let S, enemies, bullets, ebullets, gems, items, particles, texts, choices;
let spawnTimer, bossTimer, shake, lastTime = performance.now();

function startGame() {
  sound.init();
  S = {
    hp: 100, maxHp: 100, regen: 0,
    dmg: 1, fireInt: 0.22, multi: 1, pierce: 0, bulletSpeed: 520, boom: 0,
    turrets: { L: 0, R: 0, U: 0 }, tCool: { L: 0, R: 0, U: 0 },
    level: 1, xp: 0, xpNext: 6, time: 0, kills: 0,
    fireCool: 0, frenzy: 0, levels: {}, hurtFlash: 0, aimAngle: -Math.PI / 2,
  };
  enemies = []; bullets = []; ebullets = []; gems = []; items = []; particles = []; texts = [];
  spawnTimer = 1; bossTimer = 120; shake = 0;
  state = "play";
}

function onClick() {
  sound.init();
  if (state === "title" || state === "over") { startGame(); return; }
  if (state === "levelup") {
    for (let i = 0; i < choices.length; i++) {
      const b = cardRect(i);
      if (mouse.x > b.x && mouse.x < b.x + b.w && mouse.y > b.y && mouse.y < b.y + b.h) chooseUpgrade(i);
    }
  }
}

// ---------------- 生成 ----------------
function spawnEnemy(type, forceSide) {
  const d = ENEMY[type];
  const scale = 1 + S.time / 100;                 // 時間で敵が硬くなる
  const e = { type, d, hp: d.hp * scale, maxHp: d.hp * scale, r: d.r, speed: d.speed * (0.9 + Math.random() * 0.2),
              flash: 0, t: Math.random() * 10, cool: 2 + Math.random() };
  const side = forceSide || (Math.random() < 0.5 ? "L" : "R");
  if (d.kind === "ground") {
    e.x = side === "L" ? -d.r : W + d.r; e.y = GY - d.r;
  } else if (d.kind === "side") {
    e.x = side === "L" ? -d.r : W + d.r; e.y = 140 + Math.random() * 200; e.baseY = e.y;
  } else if (d.kind === "air") {
    e.x = 120 + Math.random() * (W - 240); e.y = -d.r;
  } else if (d.kind === "hover") {
    e.x = 100 + Math.random() * (W - 200); e.y = -d.r; e.hoverY = 70 + Math.random() * 70;
  }
  enemies.push(e);
}

function pickEnemyType() {
  const pool = [];
  for (const [k, d] of Object.entries(ENEMY)) {
    if (S.time < d.from) continue;
    const w = { grunt: 10, runner: 5, bat: 5, diver: 6, brute: 2, spitter: 1.5, boss: 0 }[k];
    for (let i = 0; i < w * 2; i++) pool.push(k);
  }
  return pool[Math.floor(Math.random() * pool.length)];
}

function fireBullet(x, y, ang, opts) {
  bullets.push({ x, y, vx: Math.cos(ang) * opts.speed, vy: Math.sin(ang) * opts.speed,
                 dmg: opts.dmg, pierce: opts.pierce, boom: opts.boom || 0, hit: new Set(),
                 r: opts.r || 4, color: opts.color || "#fff59d", life: 2.5 });
}

function burst(x, y, color, n = 10, sp = 160) {
  for (let i = 0; i < n; i++) {
    const a = Math.random() * Math.PI * 2, v = sp * (0.3 + Math.random());
    particles.push({ x, y, vx: Math.cos(a) * v, vy: Math.sin(a) * v, life: 0.5 + Math.random() * 0.3, color });
  }
}
function floatText(x, y, s, color = "#fff") { texts.push({ x, y, s, color, life: 0.8 }); }

// ---------------- 更新 ----------------
function update(dt) {
  S.time += dt;
  S.hp = Math.min(S.maxHp, S.hp + S.regen * dt);
  S.hurtFlash = Math.max(0, S.hurtFlash - dt);
  S.frenzy = Math.max(0, S.frenzy - dt);
  shake = Math.max(0, shake - dt * 30);

  // --- 敵の出現 ---
  spawnTimer -= dt;
  const interval = Math.max(0.28, 1.5 - S.time * 0.008);
  if (spawnTimer <= 0) {
    spawnTimer = interval * (0.7 + Math.random() * 0.6);
    const n = 1 + Math.floor(S.time / 75);
    for (let i = 0; i < n; i++) spawnEnemy(pickEnemyType());
  }
  bossTimer -= dt;
  if (bossTimer <= 0) { bossTimer = 120; spawnEnemy("boss"); floatText(W / 2, 120, "巨兵 接近!", "#ff7043"); }

  // --- エイム ---
  let target = { x: mouse.x, y: mouse.y };
  if (autoAim) {
    let best = null, bd = 1e9;
    for (const e of enemies) { const dd = Math.hypot(e.x - P.x, e.y - P.y); if (dd < bd) { bd = dd; best = e; } }
    if (best) target = best;
  }
  let ang = Math.atan2(target.y - P.y, target.x - P.x);
  // 地面より下は狙えない(上半円に制限)
  if (ang > 0.15 && ang < Math.PI - 0.15) ang = ang < Math.PI / 2 ? 0.15 : Math.PI - 0.15;
  S.aimAngle = ang;

  // --- 自機の自動連射 ---
  S.fireCool -= dt;
  const fi = S.fireInt * (S.frenzy > 0 ? 0.5 : 1);
  if (S.fireCool <= 0) {
    S.fireCool = fi;
    const spread = 0.12;
    for (let i = 0; i < S.multi; i++) {
      const off = (i - (S.multi - 1) / 2) * spread;
      const a = ang + off;
      fireBullet(P.x + Math.cos(a) * 26, P.y + Math.sin(a) * 26, a,
        { speed: S.bulletSpeed, dmg: S.dmg, pierce: S.pierce, boom: S.boom });
    }
    sfx.shot();
  }

  // --- タレット ---
  for (const k of ["L", "R", "U"]) {
    const lv = S.turrets[k]; if (!lv) continue;
    S.tCool[k] -= dt;
    if (S.tCool[k] > 0) continue;
    const pos = turretPos(k);
    let best = null, bd = 1e9;
    for (const e of enemies) {
      const ok = k === "L" ? e.x < P.x - 20 && e.y > 200 : k === "R" ? e.x > P.x + 20 && e.y > 200 : e.y < 300;
      if (!ok) continue;
      const dd = Math.hypot(e.x - pos.x, e.y - pos.y);
      if (dd < bd) { bd = dd; best = e; }
    }
    if (best) {
      S.tCool[k] = 1.1 / (1 + lv * 0.35);
      const a = Math.atan2(best.y - pos.y, best.x - pos.x);
      fireBullet(pos.x, pos.y, a, { speed: 480, dmg: 0.6 + lv * 0.4, pierce: 0, r: 3, color: "#80deea" });
    }
  }

  // --- 弾 ---
  for (const b of bullets) {
    b.x += b.vx * dt; b.y += b.vy * dt; b.life -= dt;
    if (b.x < -20 || b.x > W + 20 || b.y < -20 || b.y > GY + 5) b.life = 0;
    // アイテムに当たったら取得
    for (const it of items) {
      if (!it.dead && Math.hypot(it.x - b.x, it.y - b.y) < 16 + b.r) { collectItem(it); }
    }
    // 敵弾を撃ち落とせる
    for (const eb of ebullets) {
      if (eb.life > 0 && Math.hypot(eb.x - b.x, eb.y - b.y) < eb.r + b.r) { eb.life = 0; burst(eb.x, eb.y, "#a5d6a7", 5, 80); }
    }
    for (const e of enemies) {
      if (b.life <= 0) break;
      if (e.hp <= 0 || b.hit.has(e)) continue;
      if (Math.hypot(e.x - b.x, e.y - b.y) < e.r + b.r) {
        b.hit.add(e);
        damageEnemy(e, b.dmg);
        if (b.boom) explode(b.x, b.y, 30 + b.boom * 14, b.dmg * 0.6, e);
        if (b.pierce > 0) b.pierce--; else b.life = 0;
      }
    }
  }
  bullets = bullets.filter(b => b.life > 0);

  // --- 敵 ---
  for (const e of enemies) {
    e.t += dt; e.flash = Math.max(0, e.flash - dt);
    const k = e.d.kind;
    if (k === "ground") {
      const dir = Math.sign(P.x - e.x);
      e.x += dir * e.speed * dt;
      if (Math.abs(P.x - e.x) < e.r + 20) hitPlayer(e);
    } else if (k === "side") {
      const dir = Math.sign(P.x - e.x);
      e.x += dir * e.speed * dt;
      // 波打ちながら近づき、近くなったら自機へ降下
      const near = Math.abs(P.x - e.x) < 220;
      if (near) e.baseY += (P.y - e.baseY) * dt * 1.5;
      e.y = e.baseY + Math.sin(e.t * 4) * 30;
      if (Math.hypot(P.x - e.x, P.y - e.y) < e.r + 20) hitPlayer(e);
    } else if (k === "air") {
      const a = Math.atan2(P.y - e.y, P.x - e.x);
      e.x += (Math.cos(a) * e.speed + Math.cos(e.t * 2.5) * 60) * dt;
      e.y += Math.sin(a) * e.speed * dt;
      if (Math.hypot(P.x - e.x, P.y - e.y) < e.r + 20) hitPlayer(e);
    } else if (k === "hover") {
      if (e.y < e.hoverY) e.y += e.speed * dt;
      e.x += Math.sin(e.t * 0.8) * 40 * dt;
      e.cool -= dt;
      if (e.cool <= 0 && e.y >= e.hoverY - 1) {
        e.cool = 3.2;
        const a = Math.atan2(P.y - e.y, P.x - e.x);
        ebullets.push({ x: e.x, y: e.y, vx: Math.cos(a) * 130, vy: Math.sin(a) * 130, r: 7, life: 8, dmg: 10 });
      }
    }
  }
  enemies = enemies.filter(e => e.hp > 0);

  // --- 敵弾 ---
  for (const eb of ebullets) {
    eb.x += eb.vx * dt; eb.y += eb.vy * dt; eb.life -= dt;
    if (Math.hypot(P.x - eb.x, P.y - eb.y) < eb.r + 18) {
      eb.life = 0; S.hp -= eb.dmg; S.hurtFlash = 0.3; shake = 6; sfx.hurt();
      floatText(P.x, P.y - 40, "-" + eb.dmg, "#ff8a80");
    }
  }
  ebullets = ebullets.filter(b => b.life > 0);

  // --- 経験値ジェム(自機へ吸い寄せ) ---
  for (const g of gems) {
    g.t += dt;
    if (g.t < 0.4) { g.x += g.vx * dt; g.y += g.vy * dt; g.vy += 300 * dt; if (g.y > GY - 6) { g.y = GY - 6; g.vy = 0; } }
    else {
      const a = Math.atan2(P.y - g.y, P.x - g.x), sp = 250 + g.t * 400;
      g.x += Math.cos(a) * sp * dt; g.y += Math.sin(a) * sp * dt;
      if (Math.hypot(P.x - g.x, P.y - g.y) < 20) { g.dead = true; gainXp(g.v); }
    }
  }
  gems = gems.filter(g => !g.dead);

  // --- アイテム(ゆっくり漂って消える) ---
  for (const it of items) {
    it.t += dt; it.y += Math.sin(it.t * 2) * 10 * dt; it.x += it.vx * dt;
    if (it.t > 7) it.dead = true;
  }
  items = items.filter(i => !i.dead);

  // --- 演出 ---
  for (const p of particles) { p.x += p.vx * dt; p.y += p.vy * dt; p.vx *= 0.92; p.vy *= 0.92; p.life -= dt; }
  particles = particles.filter(p => p.life > 0);
  for (const t of texts) { t.y -= 30 * dt; t.life -= dt; }
  texts = texts.filter(t => t.life > 0);

  if (S.hp <= 0) { S.hp = 0; state = "over"; sfx.bomb(); }
}

function damageEnemy(e, dmg) {
  if (e.hp <= 0) return;
  e.hp -= dmg; e.flash = 0.08;
  sfx.hit();
  if (e.hp <= 0) killEnemy(e);
}

function killEnemy(e) {
  S.kills++;
  sfx.kill();
  burst(e.x, e.y, e.d.color, e.type === "boss" ? 40 : 12);
  const n = e.type === "boss" ? 10 : 1;
  for (let i = 0; i < n; i++)
    gems.push({ x: e.x, y: e.y, vx: (Math.random() - 0.5) * 160, vy: -120 - Math.random() * 120, t: 0, v: Math.ceil(e.d.xp / n) });
  // アイテムドロップ
  const chance = e.type === "boss" ? 1 : 0.05;
  if (Math.random() < chance) {
    const keys = Object.keys(ITEMS);
    let type = keys[Math.floor(Math.random() * keys.length)];
    if (S.hp < S.maxHp * 0.4 && Math.random() < 0.5) type = "heart";
    const y = Math.min(e.y, GY - 60);
    items.push({ type, x: e.x, y, vx: (P.x - e.x) * 0.05, t: 0 });
  }
}

function explode(x, y, radius, dmg, except) {
  burst(x, y, "#ffb74d", 8, radius * 3);
  for (const e of enemies) {
    if (e === except || e.hp <= 0) continue;
    if (Math.hypot(e.x - x, e.y - y) < radius + e.r) damageEnemy(e, dmg);
  }
}

function hitPlayer(e) {
  if (e.hp <= 0) return;
  S.hp -= e.d.dmg; S.hurtFlash = 0.3; shake = 8; sfx.hurt();
  floatText(P.x, P.y - 40, "-" + e.d.dmg, "#ff8a80");
  e.hp = 0; burst(e.x, e.y, e.d.color, 14);
}

function collectItem(it) {
  it.dead = true; sfx.item();
  burst(it.x, it.y, ITEMS[it.type].color, 16);
  floatText(it.x, it.y - 20, ITEMS[it.type].desc, ITEMS[it.type].color);
  if (it.type === "heart") S.hp = Math.min(S.maxHp, S.hp + 25);
  if (it.type === "frenzy") S.frenzy = 8;
  if (it.type === "bomb") {
    sfx.bomb(); shake = 14;
    for (const e of enemies) damageEnemy(e, 25 + S.time / 6);
    ebullets = [];
  }
}

function gainXp(v) {
  S.xp += v; sfx.gem();
  if (S.xp >= S.xpNext) {
    S.xp -= S.xpNext; S.level++;
    S.xpNext = Math.floor(6 + S.level * 4 + Math.pow(S.level, 1.4));
    openLevelUp();
  }
}

function openLevelUp() {
  const avail = UPGRADES.filter(u => (S.levels[u.id] || 0) < u.max && u.id !== "heal");
  const pick = [];
  while (pick.length < 3 && avail.length) pick.push(avail.splice(Math.floor(Math.random() * avail.length), 1)[0]);
  // HPが減っていたら回復を候補に混ぜる
  if (S.hp < S.maxHp * 0.5) pick[pick.length - 1] = UPGRADES.find(u => u.id === "heal");
  choices = pick;
  state = "levelup"; sfx.lvl();
}

function chooseUpgrade(i) {
  const u = choices[i]; if (!u) return;
  u.apply(S); S.levels[u.id] = (S.levels[u.id] || 0) + 1;
  state = "play";
}

function turretPos(k) {
  return k === "L" ? { x: P.x - 70, y: GY - 14 } : k === "R" ? { x: P.x + 70, y: GY - 14 } : { x: P.x, y: GY - 78 };
}

// ---------------- 描画 ----------------
function draw() {
  ctx.save();
  if (shake > 0) ctx.translate((Math.random() - 0.5) * shake, (Math.random() - 0.5) * shake);

  // 背景
  const grd = ctx.createLinearGradient(0, 0, 0, GY);
  grd.addColorStop(0, "#0f1424"); grd.addColorStop(1, "#1c2340");
  ctx.fillStyle = grd; ctx.fillRect(-20, -20, W + 40, GY + 20);
  ctx.fillStyle = "#2a2f45"; ctx.fillRect(-20, GY, W + 40, H - GY + 20);
  ctx.fillStyle = "#3a4060"; ctx.fillRect(-20, GY, W + 40, 3);

  // 方向ラベル
  ctx.fillStyle = "rgba(255,255,255,0.06)"; ctx.font = "bold 64px sans-serif"; ctx.textAlign = "center";
  ctx.fillText("◀", 50, GY - 40); ctx.fillText("▶", W - 50, GY - 40); ctx.fillText("▼", W / 2, 70);

  if (state !== "title") drawWorld();
  ctx.restore();

  if (state === "title") drawTitle();
  if (state !== "title") drawHUD();
  if (state === "levelup") drawLevelUp();
  if (state === "pause") drawCenter("PAUSE", "P / Esc で再開");
  if (state === "over") drawCenter("GAME OVER", `生存 ${fmtTime(S.time)} ・ Lv ${S.level} ・ 撃破 ${S.kills}\nクリック / Enter でリトライ`);

  drawCrosshair();
}

function drawWorld() {
  // ジェム
  for (const g of gems) { ctx.fillStyle = "#69f0ae"; diamond(g.x, g.y, 5); }
  // アイテム
  for (const it of items) {
    const I = ITEMS[it.type];
    if (it.t > 5 && Math.floor(it.t * 8) % 2) continue; // 消える前に点滅
    ctx.beginPath(); ctx.arc(it.x, it.y, 15, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(0,0,0,0.5)"; ctx.fill();
    ctx.lineWidth = 3; ctx.strokeStyle = I.color; ctx.stroke();
    ctx.fillStyle = I.color; ctx.font = "bold 16px sans-serif"; ctx.textAlign = "center"; ctx.textBaseline = "middle";
    ctx.fillText(I.label, it.x, it.y + 1); ctx.textBaseline = "alphabetic";
  }
  // 敵
  for (const e of enemies) drawEnemy(e);
  // 敵弾
  for (const eb of ebullets) {
    ctx.beginPath(); ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
    ctx.fillStyle = "#a5d6a7"; ctx.fill(); ctx.strokeStyle = "#1b5e20"; ctx.lineWidth = 2; ctx.stroke();
  }
  // タレット
  for (const k of ["L", "R", "U"]) {
    if (!S.turrets[k]) continue;
    const p = turretPos(k);
    if (k === "U") { ctx.fillStyle = "#37474f"; ctx.fillRect(p.x - 3, p.y, 6, GY - p.y); }
    ctx.fillStyle = "#4dd0e1"; ctx.beginPath(); ctx.arc(p.x, p.y, 10, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#0b0d14"; ctx.font = "bold 10px sans-serif"; ctx.textAlign = "center"; ctx.fillText(S.turrets[k], p.x, p.y + 4);
  }
  // 弾
  for (const b of bullets) { ctx.fillStyle = b.color; ctx.beginPath(); ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2); ctx.fill(); }
  // 自機
  drawPlayer();
  // パーティクル・文字
  for (const p of particles) { ctx.globalAlpha = Math.max(0, p.life * 1.5); ctx.fillStyle = p.color; ctx.fillRect(p.x - 2, p.y - 2, 4, 4); }
  ctx.globalAlpha = 1;
  ctx.font = "bold 14px sans-serif"; ctx.textAlign = "center";
  for (const t of texts) { ctx.globalAlpha = Math.min(1, t.life * 2); ctx.fillStyle = t.color; ctx.fillText(t.s, t.x, t.y); }
  ctx.globalAlpha = 1;
  if (S.hurtFlash > 0) { ctx.fillStyle = `rgba(255,0,0,${S.hurtFlash * 0.5})`; ctx.fillRect(0, 0, W, H); }
}

function drawEnemy(e) {
  const c = e.flash > 0 ? "#ffffff" : e.d.color;
  ctx.fillStyle = c;
  const k = e.d.kind;
  if (k === "ground") {
    ctx.fillRect(e.x - e.r, e.y - e.r, e.r * 2, e.r * 2);
    ctx.fillStyle = "#111"; const dir = Math.sign(P.x - e.x);
    ctx.fillRect(e.x + dir * e.r * 0.3 - 3, e.y - e.r * 0.4, 6, 6);
  } else if (k === "side") {
    const wing = Math.sin(e.t * 18) * 8;
    ctx.beginPath(); ctx.moveTo(e.x - e.r * 1.8, e.y + wing); ctx.lineTo(e.x, e.y - 4); ctx.lineTo(e.x + e.r * 1.8, e.y + wing); ctx.lineTo(e.x, e.y + e.r); ctx.closePath(); ctx.fill();
  } else if (k === "air") {
    ctx.beginPath(); ctx.moveTo(e.x, e.y + e.r * 1.3); ctx.lineTo(e.x - e.r, e.y - e.r); ctx.lineTo(e.x + e.r, e.y - e.r); ctx.closePath(); ctx.fill();
  } else {
    ctx.beginPath(); ctx.arc(e.x, e.y, e.r, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = "#1b5e20"; ctx.beginPath(); ctx.arc(e.x, e.y + 4, e.r * 0.45, 0, Math.PI * 2); ctx.fill();
  }
  if (e.hp < e.maxHp) {
    const w = e.r * 2;
    ctx.fillStyle = "#000a"; ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w, 4);
    ctx.fillStyle = "#ff5252"; ctx.fillRect(e.x - w / 2, e.y - e.r - 9, w * Math.max(0, e.hp / e.maxHp), 4);
  }
}

function drawPlayer() {
  // 土台
  ctx.fillStyle = "#455a64"; ctx.fillRect(P.x - 28, GY - 12, 56, 12);
  // 砲身
  ctx.save(); ctx.translate(P.x, P.y); ctx.rotate(S.aimAngle);
  ctx.fillStyle = S.frenzy > 0 ? "#4dd0e1" : "#cfd8dc"; ctx.fillRect(0, -5, 30, 10);
  ctx.restore();
  // 本体
  ctx.beginPath(); ctx.arc(P.x, P.y, 18, 0, Math.PI * 2);
  ctx.fillStyle = S.hurtFlash > 0 ? "#ff8a80" : "#90caf9"; ctx.fill();
  ctx.lineWidth = 3; ctx.strokeStyle = "#1e88e5"; ctx.stroke();
}

function drawHUD() {
  // HP
  ctx.fillStyle = "#000a"; ctx.fillRect(16, 14, 244, 18);
  ctx.fillStyle = S.hp / S.maxHp < 0.3 ? "#ff5252" : "#66bb6a"; ctx.fillRect(18, 16, 240 * S.hp / S.maxHp, 14);
  ctx.fillStyle = "#fff"; ctx.font = "bold 12px sans-serif"; ctx.textAlign = "left";
  ctx.fillText(`HP ${Math.ceil(S.hp)} / ${S.maxHp}`, 24, 28);
  // XP
  ctx.fillStyle = "#000a"; ctx.fillRect(0, H - 8, W, 8);
  ctx.fillStyle = "#69f0ae"; ctx.fillRect(0, H - 8, W * S.xp / S.xpNext, 8);
  // 情報
  ctx.textAlign = "right"; ctx.font = "bold 16px sans-serif"; ctx.fillStyle = "#fff";
  ctx.fillText(fmtTime(S.time), W - 16, 30);
  ctx.font = "13px sans-serif"; ctx.fillStyle = "#cfd8dc";
  ctx.fillText(`Lv ${S.level}   撃破 ${S.kills}`, W - 16, 50);
  if (S.frenzy > 0) { ctx.fillStyle = "#4dd0e1"; ctx.fillText(`連射2倍 ${S.frenzy.toFixed(1)}s`, W - 16, 70); }
  ctx.textAlign = "left"; ctx.fillStyle = "#78909c"; ctx.font = "12px sans-serif";
  ctx.fillText(`[T] エイム: ${autoAim ? "オート" : "マウス"}   [P] ポーズ   [M] 音 ${sound.muted ? "OFF" : "ON"}`, 16, H - 16);
  // 取得済み強化
  let y = 52;
  for (const u of UPGRADES) {
    const lv = S.levels[u.id]; if (!lv || u.id === "heal") continue;
    ctx.fillStyle = "#b0bec5"; ctx.fillText(`${u.name} ${lv}`, 18, y); y += 16;
  }
}

function cardRect(i) { const w = 240, h = 150, gap = 24, x0 = (W - (w * 3 + gap * 2)) / 2; return { x: x0 + i * (w + gap), y: 190, w, h }; }

function drawLevelUp() {
  ctx.fillStyle = "rgba(5,8,16,0.75)"; ctx.fillRect(0, 0, W, H);
  ctx.fillStyle = "#fff"; ctx.font = "bold 32px sans-serif"; ctx.textAlign = "center";
  ctx.fillText(`LEVEL UP!  Lv ${S.level}`, W / 2, 140);
  ctx.font = "14px sans-serif"; ctx.fillStyle = "#b0bec5"; ctx.fillText("強化を1つ選ぶ(クリック または 1〜3キー)", W / 2, 170);
  choices.forEach((u, i) => {
    const b = cardRect(i);
    const hover = mouse.x > b.x && mouse.x < b.x + b.w && mouse.y > b.y && mouse.y < b.y + b.h;
    ctx.fillStyle = hover ? "#263259" : "#1a2140"; ctx.fillRect(b.x, b.y, b.w, b.h);
    ctx.strokeStyle = hover ? "#90caf9" : "#3a4570"; ctx.lineWidth = 2; ctx.strokeRect(b.x, b.y, b.w, b.h);
    ctx.fillStyle = "#90caf9"; ctx.font = "bold 13px sans-serif"; ctx.fillText(`[${i + 1}]`, b.x + b.w / 2, b.y + 26);
    ctx.fillStyle = "#fff"; ctx.font = "bold 20px sans-serif"; ctx.fillText(u.name, b.x + b.w / 2, b.y + 60);
    ctx.fillStyle = "#cfd8dc"; ctx.font = "13px sans-serif"; ctx.fillText(u.desc, b.x + b.w / 2, b.y + 92);
    const lv = S.levels[u.id] || 0;
    if (u.id !== "heal") { ctx.fillStyle = "#78909c"; ctx.fillText(`Lv ${lv} → ${lv + 1}`, b.x + b.w / 2, b.y + 124); }
  });
}

function drawTitle() {
  ctx.fillStyle = "rgba(5,8,16,0.6)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.fillStyle = "#90caf9"; ctx.font = "bold 56px sans-serif";
  ctx.fillText("TRIDENT WAVE", W / 2, 170);
  ctx.fillStyle = "#cfd8dc"; ctx.font = "16px sans-serif";
  const lines = [
    "左・右・上から押し寄せる敵から、動けない砲台を守り抜け",
    "マウスで狙う方向へ自動で連射 / 敵を倒すと経験値でレベルアップ",
    "浮かんでいるアイテム(♥ B F)は撃って取る",
    "緑の敵弾は撃ち落とせる",
  ];
  lines.forEach((l, i) => ctx.fillText(l, W / 2, 240 + i * 28));
  ctx.fillStyle = "#fff"; ctx.font = "bold 22px sans-serif";
  if (Math.floor(performance.now() / 500) % 2) ctx.fillText("クリックでスタート", W / 2, 400);
}

function drawCenter(title, sub) {
  ctx.fillStyle = "rgba(5,8,16,0.7)"; ctx.fillRect(0, 0, W, H);
  ctx.textAlign = "center"; ctx.fillStyle = "#fff"; ctx.font = "bold 48px sans-serif";
  ctx.fillText(title, W / 2, 220);
  ctx.font = "18px sans-serif"; ctx.fillStyle = "#cfd8dc";
  sub.split("\n").forEach((l, i) => ctx.fillText(l, W / 2, 270 + i * 30));
}

function drawCrosshair() {
  const { x, y } = mouse;
  ctx.strokeStyle = autoAim && state === "play" ? "#78909c" : "#ff5252"; ctx.lineWidth = 2;
  ctx.beginPath(); ctx.arc(x, y, 10, 0, Math.PI * 2);
  ctx.moveTo(x - 16, y); ctx.lineTo(x - 5, y); ctx.moveTo(x + 5, y); ctx.lineTo(x + 16, y);
  ctx.moveTo(x, y - 16); ctx.lineTo(x, y - 5); ctx.moveTo(x, y + 5); ctx.lineTo(x, y + 16);
  ctx.stroke();
}

function diamond(x, y, r) { ctx.beginPath(); ctx.moveTo(x, y - r); ctx.lineTo(x + r, y); ctx.lineTo(x, y + r); ctx.lineTo(x - r, y); ctx.closePath(); ctx.fill(); }
function fmtTime(t) { const m = Math.floor(t / 60), s = Math.floor(t % 60); return `${m}:${String(s).padStart(2, "0")}`; }

// ---------------- メインループ ----------------
function loop(now) {
  const dt = Math.min(0.05, (now - lastTime) / 1000);
  lastTime = now;
  if (state === "play") update(dt);
  draw();
  requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

// デバッグ用(ブラウザのコンソールから確認できる)
window.__tw = { get S() { return S; }, get enemies() { return enemies; }, get state() { return state; }, startGame, ENEMY, UPGRADES };
</script>
